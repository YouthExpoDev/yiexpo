<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch("projects.xlsx")
        .then((response) => response.arrayBuffer())
        .then((data) => {
            const workbook = XLSX.read(data, { type: "array" });
            const sheetName = workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(sheet);

            const container = document.getElementById("projects-container");
            container.innerHTML = "";

            json.forEach((row) => {
                // === DETECT PARTICIPANT COLUMNS ===
                const participants = Object.keys(row)
                    .filter(key => key.toLowerCase().startsWith("participant"))
                    .map(key => row[key])
                    .filter(name => name && name.trim() !== "")
                    .join(", ");  // <-- comma-separated participants

                // === CREATE PROJECT CARD ===
                const card = document.createElement("div");
                card.className = "project-card";

                card.innerHTML = `
                    <div class="project-content">
                        <h2 class="project-topic">${row.Topic || "No Topic"}</h2>
                        <p class="project-theme">${row.Theme || ""}</p>

                        <div class="left-info">
                            <p class="project-subject">${row.Subject || ""}</p>
                        </div>

                        <div class="right-info">
                            <p class="leader-label"><strong>Leader:</strong> ${row.Leader || ""}</p>
                            <p class="participants-label"><strong>Participants:</strong> ${participants}</p>
                        </div>

                        <div class="bottom-info">
                            <p class="class-section">Class: ${row.Class || ""} | Section: ${row.Section || ""}</p>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        })
        .catch((error) => console.error("Error loading spreadsheet:", error));
});
</script>
