<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Projects</title>
<link rel="stylesheet" href="style.css">

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding-top: 70px;
    }

    /* MENU BAR */
    .navbar {
        width: 100%;
        height: 60px;
        background: #111;
        color: white;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        z-index: 1000;
    }

    .navbar-left {
        font-size: 24px;
        font-weight: bold;
        font-family: 'HK Modular', sans-serif;
    }

    .navbar-right {
        display: flex;
        gap: 20px;
    }

    .navbar-right button, .navbar-right a {
        background: none;
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
    }

    .project-card {
        width: 90%;
        margin: 20px auto;
        padding: 15px;
        border-radius: 10px;
        background: #f4f4f4;
        box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }

    .topic {
        font-size: 24px;
        font-weight: bold;
        text-align: right;
    }

    .theme {
        font-size: 16px;
        margin-top: 4px;
        text-align: right;
    }

    .subject {
        font-size: 16px;
        margin-top: 10px;
        font-weight: bold;
        text-align: left;
    }

    .leader {
        font-size: 17px;
        font-weight: bold;
        text-align: right;
        margin-top: 10px;
    }

    .participants {
        font-size: 15px;
        white-space: pre-line;
        margin-top: 5px;
        text-align: right;
    }

    .class-sec {
        font-size: 14px;
        text-align: left;
        margin-top: 10px;
        color: #333;
    }
</style>
</head>

<body>

<!-- MENU BAR -->
<div class="navbar">
    <div class="navbar-left">Y-I-Expo</div>

    <div class="navbar-right">
        <button onclick="window.history.back()">Go Back</button>
        <a href="dev.html">Developer</a>
        <button onclick="toggleTheme()">Mode</button>
    </div>
</div>

<h2 style="text-align:center;">Explore All Projects</h2>

<div id="projectContainer"></div>


<script>
// DARK / LIGHT MODE
function toggleTheme() {
    document.body.classList.toggle("dark");
}

// DISABLE INSPECT + RIGHT CLICK
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
    if (e.key === "F12" || (e.ctrlKey && e.shiftKey && ["I","C","J"].includes(e.key)) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
    }
});

// FETCH DATA FROM GOOGLE SHEET
const sheetID = "1ZQ1g4MwSgCeRuer6gNx6_BY3eit7kddCWjWgDmgTpfA";
const sheetName = "Form_Responses";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

fetch(url)
    .then(res => res.text())
    .then(data => {
        const json = JSON.parse(data.substr(47).slice(0, -2));
        const rows = json.table.rows;

        const container = document.getElementById("projectContainer");

        rows.forEach(row => {
            const c = row.c;

            if (!c[1] || !c[2] || !c[3]) return; // ignore empty rows

            const subject = c[1].v || "";
            const topic = c[2].v || "";
            const theme = c[3].v || "";
            const className = c[4].v || "";
            const leader = c[5].v || "";
            const section = c[6].v || "";

            // collect participants dynamic
            let participants = [];
            for (let i = 7; i < c.length; i++) {
                if (c[i] && c[i].v) participants.push(c[i].v);
            }

            const projectHTML = `
                <div class="project-card">
                    <div class="topic">${topic}</div>
                    <div class="theme">${theme}</div>
                    <div class="subject">${subject}</div>
                    <div class="leader">Leader: ${leader}</div>
                    <div class="participants">${participants.join("\n")}</div>
                    <div class="class-sec">Class: ${className} — Section: ${section}</div>
                </div>
            `;

            container.innerHTML += projectHTML;
        });
    })
    .catch(err => console.error("Fetch error:", err));
</script>

</body>
</html>
