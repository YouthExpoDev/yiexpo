<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Developer </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- Global Reset and Variables --- */
        :root {
            /* Vibrant, light colors */
            --color-primary: #ff6b6b; /* Coral Red */
            --color-secondary: #48dbfb; /* Sky Blue */
            --color-accent: #feca57; /* Sunny Yellow */
            
            /* Light Backgrounds */
            --color-background-start: #f5f5f5;
            --color-background-end: #e0e0e0;
            
            /* Text Colors */
            --color-text-dark: #2c3e50;
            --color-text-light: #ffffff;
            
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Roboto:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Light gradient background */
            background: linear-gradient(135deg, var(--color-background-start), var(--color-background-end));
            font-family: var(--font-body);
            color: var(--color-text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Profile Card Container --- */
        .profile-card {
            max-width: 400px;
            width: 100%;
            text-align: center;
            background-color: var(--color-text-light);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            animation: card-in 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes card-in {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- Profile Image --- */
        .profile-image-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
            /* Create a colorful, rotating border effect */
            background: linear-gradient(45deg, var(--color-primary), var(--color-secondary), var(--color-accent));
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.2);
            animation: gradient-rotate 4s linear infinite;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            /* Inner border to separate from the gradient */
            border: 5px solid var(--color-text-light);
        }
        
        @keyframes gradient-rotate {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- Text Content --- */
        .profile-name {
            font-family: var(--font-heading);
            font-size: 2.5em;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -1px;
            margin-bottom: 5px;
            animation: text-slide 1s ease-out 0.2s forwards;
            opacity: 0;
        }

        .profile-tagline {
            font-family: var(--font-body);
            font-size: 1.1em;
            color: #7f8c8d; /* Light gray text */
            margin-bottom: 30px;
            font-weight: 300;
            animation: text-slide 1s ease-out 0.4s forwards;
            opacity: 0;
        }

        @keyframes text-slide {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- Contact Button --- */
        .contact-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, var(--color-primary), var(--color-secondary));
            color: var(--color-text-light);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            
            /* Premium Hover Effect */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .contact-button i {
            margin-right: 8px;
        }

        .contact-button:hover {
            transform: translateY(-3px) scale(1.02);
            background: linear-gradient(45deg, var(--color-secondary), var(--color-primary));
            box-shadow: 0 8px 20px rgba(72, 219, 251, 0.5);
        }

        /* --- Mobile Optimization --- */
        @media (max-width: 480px) {
            .profile-card {
                padding: 30px 20px;
            }

            .profile-name {
                font-size: 2em;
            }

            .profile-picture {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-image-wrapper">
            <img src="https://via.placeholder.com/120/ff6b6b/ffffff?text=DEV" alt="Developer Profile Picture" class="profile-picture">
        </div>
        
        <h1 class="profile-name">Bhavya Sharma</h1>
        
        <p class="profile-tagline">
            Tech Enthusiastic and Patriot
        </p>

        <a href="thebhavya85@outlook.com" class="contact-button">
            <i class="fas fa-paper-plane"></i> Get In Touch
        </a>
    </div>
</body>
</html>
