<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Introduction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* --- Global Reset and Variables --- */
        :root {
            /* Vibrant, light colors */
            --color-primary: #ff6b6b; /* Coral Red */
            --color-secondary: #48dbfb; /* Sky Blue */
            
            /* Light Backgrounds */
            --color-background-start: #f5f5f5;
            --color-background-end: #e0e0e0;
            
            /* Text Colors */
            --color-text-dark: #2c3e50;
            --color-text-light: #ffffff;
            
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Roboto:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Light gradient background */
            background: linear-gradient(135deg, var(--color-background-start), var(--color-background-end));
            font-family: var(--font-body);
            color: var(--color-text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- Profile Card Container (UX Premium) --- */
        .profile-card {
            max-width: 400px;
            width: 100%;
            text-align: center;
            background-color: var(--color-text-light);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            /* Initial Animation: Card enters smoothly */
            animation: card-in 0.8s ease-out forwards;
            opacity: 0;
        }

        @keyframes card-in {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- Profile Image with Colorful Border --- */
        .profile-image-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
            /* Gradient border effect */
            background: linear-gradient(45deg, var(--color-primary), var(--color-secondary));
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.2);
            /* Hover animation for the image */
            transition: transform 0.3s ease;
        }
        
        .profile-image-wrapper:hover {
            transform: scale(1.05);
            box-shadow: 0 0 0 6px rgba(72, 219, 251, 0.4);
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            /* Inner border to separate from the gradient */
            border: 5px solid var(--color-text-light);
        }

        /* --- Text Content --- */
        .profile-name {
            font-family: var(--font-heading);
            font-size: 2.5em;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -1px;
            margin-bottom: 5px;
            /* Text slide-in animation */
            animation: text-slide 1s ease-out 0.2s forwards;
            opacity: 0;
        }

        .profile-tagline {
            font-family: var(--font-body);
            font-size: 1.1em;
            color: #7f8c8d; /* Light gray text */
            margin-bottom: 30px;
            font-weight: 300;
            /* Text slide-in animation */
            animation: text-slide 1s ease-out 0.4s forwards;
            opacity: 0;
        }

        @keyframes text-slide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Contact Button (Premium UX) --- */
        .contact-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            /* Vibrant gradient background */
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
            color: var(--color-text-light);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            
            /* Premium Hover/Click Transition */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .contact-button i {
            margin-right: 8px;
            transition: transform 0.3s ease;
        }

        .contact-button:hover {
            transform: translateY(-3px) scale(1.02);
            /* Hover reverses gradient for dynamic effect */
            background: linear-gradient(90deg, var(--color-secondary), var(--color-primary));
            box-shadow: 0 8px 20px rgba(72, 219, 251, 0.5);
        }
        
        .contact-button:hover i {
            transform: translateX(5px);
        }


        /* --- Mobile Optimization --- */
        @media (max-width: 480px) {
            body {
                align-items: flex-start; /* Start profile higher on small screens */
                padding-top: 40px;
            }
            .profile-card {
                padding: 30px 20px;
                margin-top: 0;
            }

            .profile-name {
                font-size: 2em;
            }

            .profile-picture {
                width: 100px;
                height: 100px;
            }
            
            .contact-button {
                width: 100%; /* Full width button for easy tapping */
            }
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-image-wrapper">
            <img src="ae1848e0d5b5a9c8801fd01ce775f687.jpg" alt="Developer Profile Picture" class="profile-picture">
        </div>
        
        <h1 class="profile-name">Bhavya Sahrma</h1>
        
        <p class="profile-tagline">
            Full-Stack Developer | Innovator | Crafting delightful digital experiences.
        </p>

        <a href="thebhavya85@outlook.com" class="contact-button">
            <i class="fas fa-envelope"></i> Email Me Directly
        </a>
    </div>
</body>
</html>
