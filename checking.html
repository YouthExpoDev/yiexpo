<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've Been Pranked!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* To prevent scrollbars if content moves around */
        }
        .prank-container {
            text-align: center;
            padding: 20px;
            border: 2px solid #ccc;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff0000;
        }
        p {
            font-size: 1.2em;
        }
        /* This button can be made 'run away' with JavaScript */
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="prank-container">
        <h1>Surprise!</h1>
        <p>You've just stumbled upon a harmless prank.</p>
        <p>Click the button below to continue (if you can catch it!).</p>
        <button id="prankButton">Click Me!</button>
    </div>

    <script>
        // Example JavaScript for a "runaway button" prank
        const prankButton = document.getElementById('prankButton');

        prankButton.addEventListener('mouseover', () => {
            const bodyWidth = document.body.clientWidth;
            const bodyHeight = document.body.clientHeight;
            const buttonWidth = prankButton.offsetWidth;
            const buttonHeight = prankButton.offsetHeight;

            const newX = Math.random() * (bodyWidth - buttonWidth);
            const newY = Math.random() * (bodyHeight - buttonHeight);

            prankButton.style.position = 'absolute';
            prankButton.style.left = `${newX}px`;
            prankButton.style.top = `${newY}px`;
        });
    </script>
</body>
</html>
